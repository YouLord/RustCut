[package]
name = "rustcut"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A small, experimental Rust video editing engine"
license = "MIT"

[lib]
name = "rustcut"
path = "src/lib.rs"

[[bin]]
name = "rustcut"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
